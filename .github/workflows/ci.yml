# Runs on every push and pull request. Tests never call a real model, so no secrets are needed.
name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16 # same image as docker-compose.yml
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: study_buddy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/study_buddy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-serve.txt
      # the serving set (no torch): every model import in the code is lazy, and tests fake the models
      - run: pip install -r backend/requirements-serve.txt pytest==9.1.1 ruff==0.17.0
      - run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/db/init.sql
      - run: python -m ruff check backend # from the repo root, like CLAUDE.md
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # same as the Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
